[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sibuchen-agents"
version = "0.1.1"
description = "模块化、可扩展的 Python AI Agent 框架，支持多种推理范式、丰富的内置工具、智能记忆系统与多协议通信能力"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "sibuchen" }
]
keywords = [
    "agent", "llm", "ai", "openai", "gemini", "react", "function-calling",
    "rag", "memory", "mcp", "a2a", "multi-agent"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# ==================== 核心依赖（必须安装）====================
dependencies = [
    "google-genai>=1.73.1",
    "numpy>=2.0.0,<3.0.0",
    "openai>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.25.0,<3.0.0",
    "tiktoken>=0.5.0",
    "beautifulsoup4>=4.9.0,<5.0.0",
    "dashscope",
    "networkx>=2.6.0,<4.0.0",
]

# ==================== 可选依赖分组 ====================
[project.optional-dependencies]

# 搜索功能：pip install sibuchen-agents[search]
search = [
    "markdownify",
    "tavily-python>=0.7.12",
    "google-search-results>=2.4.2",
    "duckduckgo-search",
]

# 记忆系统：pip install sibuchen-agents[memory]
memory = [
    "Pillow",
    "qdrant-client>=1.9.0,<1.16.0",
    "neo4j>=5.0.0",
    "spacy>=3.4.0",
    "scikit-learn>=1.0.0",
]

# RAG 系统：pip install sibuchen-agents[rag]
rag = [
    "langdetect",
    "transformers>=4.20.0",
    "torch>=1.12.0",
    "sentence-transformers>=2.2.0",
    "markitdown>=0.0.1",
    "pypdf>=3.9.0",
    "pdfminer.six>=20221105",
]

# 通信协议：pip install sibuchen-agents[protocols]
protocols = [
    "fastmcp>=2.0.0,<3.0.0",
    "a2a-sdk>=0.1.0",
]

# IM 即时通讯：pip install sibuchen-agents[im]
im = [
    "nonebot2>=2.5.0",
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-telegram>=0.1.0b20",
    "nonebot-adapter-feishu>=2.6.0",
]

# 音频处理（可选内置工具）
audio = [
    "librosa",
]

# 全功能安装：pip install sibuchen-agents[all]
all = [
    "sibuchen-agents[search]",
    "sibuchen-agents[memory]",
    "sibuchen-agents[rag]",
    "sibuchen-agents[protocols]",
    "sibuchen-agents[im]",
    "sibuchen-agents[audio]",
]

# 开发工具：pip install sibuchen-agents[dev]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/sibuchen"
Repository = "https://github.com/sibuchen/sibuchen-agents"
Issues = "https://github.com/sibuchen/sibuchen-agents/issues"

# ==================== 工具配置 ====================

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sibuchen_agents*"]
exclude = ["tests*", "test*", ".venv*", "dist*", "build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
ignore_missing_imports = true
